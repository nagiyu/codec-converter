AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions 用の最小 IAM ポリシー
  (Minimal IAM policy for GitHub Actions CI/CD)

  このテンプレートは、GitHub Actions が ECR へのプッシュと
  CloudFormation スタックのデプロイに必要な最小限の権限を定義します。

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: デプロイ環境名

  EcrRepositoryArn:
    Type: String
    Description: "ECR リポジトリの ARN (例: arn:aws:ecr:ap-northeast-1:123456789012:repository/codec-converter-*)"

Resources:
  # ============================================================================
  # GitHub Actions 用 IAM ポリシー
  # ============================================================================
  GitHubActionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'codec-converter-github-actions-policy-${Environment}'
      Description: GitHub Actions CI/CD 用の最小権限ポリシー
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # ECR 認証トークン取得権限
          - Sid: AllowECRGetAuthorizationToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'

          # ECR イメージプッシュ権限
          - Sid: AllowECRPushImage
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
            Resource:
              - !Ref EcrRepositoryArn

          # CloudFormation スタック操作権限
          - Sid: AllowCloudFormationOperations
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
            Resource:
              - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/codec-converter-*/*'

          # CloudFormation テンプレート検証（リソース非指定、ValidateTemplate はリソース制限不可）
          - Sid: AllowCloudFormationValidate
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
            Resource: '*'

Outputs:
  GitHubActionsPolicyArn:
    Description: GitHub Actions ポリシーの ARN
    Value: !Ref GitHubActionsPolicy
    Export:
      Name: !Sub '${AWS::StackName}-GitHubActionsPolicyArn'
