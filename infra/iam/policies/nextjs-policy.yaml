AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Next.js アプリケーション用の最小 IAM ポリシー
  (Minimal IAM policy for Next.js application)

  このテンプレートは、Next.js アプリケーションが S3、DynamoDB、
  および Batch と連携するために必要な最小限の権限を定義します。

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: デプロイ環境名

  UploadBucketArn:
    Type: String
    Description: "アップロード用 S3 バケットの ARN (例: arn:aws:s3:::my-upload-bucket)"

  OutputBucketArn:
    Type: String
    Description: "出力用 S3 バケットの ARN (例: arn:aws:s3:::my-output-bucket)"

  EntitiesTableArn:
    Type: String
    Description: DynamoDB Entities テーブルの ARN

  BatchJobQueueArn:
    Type: String
    Description: AWS Batch ジョブキューの ARN

  BatchJobDefinitionArn:
    Type: String
    Description: AWS Batch ジョブ定義の ARN

Resources:
  # ============================================================================
  # Next.js 用 S3 アクセスポリシー
  # ============================================================================
  NextjsS3Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'codec-converter-nextjs-s3-policy-${Environment}'
      Description: Next.js アプリケーション用 S3 アクセスポリシー
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # アップロードバケットへの読み取り・書き込み権限
          # (事前署名 URL 生成とファイル検証のため)
          - Sid: AllowUploadBucketAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub '${UploadBucketArn}/*'

          # 出力バケットへの読み取り権限
          # (ダウンロードプロキシのため)
          - Sid: AllowOutputBucketRead
            Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              - !Sub '${OutputBucketArn}/*'

          # バケット一覧取得権限
          - Sid: AllowBucketList
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - !Ref UploadBucketArn
              - !Ref OutputBucketArn

  # ============================================================================
  # Next.js 用 DynamoDB アクセスポリシー
  # ============================================================================
  NextjsDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'codec-converter-nextjs-dynamodb-policy-${Environment}'
      Description: Next.js アプリケーション用 DynamoDB アクセスポリシー
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Entities テーブルへの CRUD 権限
          - Sid: AllowDynamoDBAccess
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
            Resource:
              - !Ref EntitiesTableArn
              # GSI へのクエリも許可
              - !Sub '${EntitiesTableArn}/index/*'

  # ============================================================================
  # Next.js 用 Batch ジョブ送信ポリシー
  # ============================================================================
  NextjsBatchPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'codec-converter-nextjs-batch-policy-${Environment}'
      Description: Next.js アプリケーション用 Batch ジョブ送信ポリシー
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Batch ジョブの送信権限
          - Sid: AllowBatchSubmitJob
            Effect: Allow
            Action:
              - batch:SubmitJob
            Resource:
              - !Ref BatchJobQueueArn
              - !Ref BatchJobDefinitionArn

          # Batch ジョブのステータス確認権限
          # 注意: DescribeJobs は AWS Batch API の制限によりリソースレベルの制限ができないため、
          # Resource: '*' を使用しています。
          - Sid: AllowBatchDescribeJobs
            Effect: Allow
            Action:
              - batch:DescribeJobs
            Resource: '*'

Outputs:
  NextjsS3PolicyArn:
    Description: Next.js S3 ポリシーの ARN
    Value: !Ref NextjsS3Policy
    Export:
      Name: !Sub '${AWS::StackName}-NextjsS3PolicyArn'

  NextjsDynamoDBPolicyArn:
    Description: Next.js DynamoDB ポリシーの ARN
    Value: !Ref NextjsDynamoDBPolicy
    Export:
      Name: !Sub '${AWS::StackName}-NextjsDynamoDBPolicyArn'

  NextjsBatchPolicyArn:
    Description: Next.js Batch ポリシーの ARN
    Value: !Ref NextjsBatchPolicy
    Export:
      Name: !Sub '${AWS::StackName}-NextjsBatchPolicyArn'
