AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template for ECR repository.
  Stores Docker images for the batch worker (ffmpeg transcoding).

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name for resource naming

Resources:
  # ============================================================================
  # ECR Repository
  # ============================================================================

  # Batch Worker Repository - stores Docker images for the ffmpeg batch worker
  BatchWorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'codec-converter-batch-${Environment}'
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: CodecConverter
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: BatchWorkerImage

Outputs:
  BatchWorkerRepositoryName:
    Description: Name of the ECR repository for batch worker images
    Value: !Ref BatchWorkerRepository
    Export:
      Name: !Sub '${AWS::StackName}-BatchWorkerRepositoryName'

  BatchWorkerRepositoryArn:
    Description: ARN of the ECR repository for batch worker images
    Value: !GetAtt BatchWorkerRepository.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BatchWorkerRepositoryArn'

  BatchWorkerRepositoryUri:
    Description: URI of the ECR repository for batch worker images
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${BatchWorkerRepository}'
    Export:
      Name: !Sub '${AWS::StackName}-BatchWorkerRepositoryUri'
