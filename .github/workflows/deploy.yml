name: Deploy

on:
  push:
    # branches:
    #   - master
    #   - develop
    #   - 'release/**'
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

jobs:
  # Determine deployment environment based on branch
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  # Deploy CloudFormation stacks for IAM policies (must be deployed first)
  deploy-iam-policies:
    name: Deploy IAM Policies
    runs-on: ubuntu-latest
    needs: [setup]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Next.js Policy
        run: |
          aws cloudformation deploy \
            --template-file infra/iam/policies/nextjs-policy.yaml \
            --stack-name codec-converter-nextjs-policy-${{ needs.setup.outputs.environment }} \
            --parameter-overrides Environment=${{ needs.setup.outputs.environment }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy Batch Policy
        run: |
          aws cloudformation deploy \
            --template-file infra/iam/policies/batch-policy.yaml \
            --stack-name codec-converter-batch-policy-${{ needs.setup.outputs.environment }} \
            --parameter-overrides Environment=${{ needs.setup.outputs.environment }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # Deploy ECR repositories
  deploy-ecr:
    name: Deploy ECR
    runs-on: ubuntu-latest
    needs: [setup, deploy-iam-policies]
    permissions:
      contents: read
      id-token: write
    outputs:
      web_repo_uri: ${{ steps.ecr-outputs.outputs.web_repo_uri }}
      batch_repo_uri: ${{ steps.ecr-outputs.outputs.batch_repo_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ECR CFN
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation/ecr.yaml \
            --stack-name codec-converter-ecr-${{ needs.setup.outputs.environment }} \
            --parameter-overrides Environment=${{ needs.setup.outputs.environment }} \
            --no-fail-on-empty-changeset

      - name: Get ECR Outputs
        id: ecr-outputs
        run: |
          WEB_URI=$(aws cloudformation describe-stacks \
            --stack-name codec-converter-ecr-${{ needs.setup.outputs.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='WebAppRepositoryUri'].OutputValue" \
            --output text)
          BATCH_URI=$(aws cloudformation describe-stacks \
            --stack-name codec-converter-ecr-${{ needs.setup.outputs.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='BatchWorkerRepositoryUri'].OutputValue" \
            --output text)
          echo "web_repo_uri=$WEB_URI" >> $GITHUB_OUTPUT
          echo "batch_repo_uri=$BATCH_URI" >> $GITHUB_OUTPUT

  # Deploy IAM roles required for Batch (BatchJobRole, BatchTaskExecutionRole)
  deploy-iam-roles:
    name: Deploy IAM Roles
    runs-on: ubuntu-latest
    needs: [setup, deploy-iam-policies]
    permissions:
      contents: read
      id-token: write
    outputs:
      batch_job_role_arn: ${{ steps.iam-roles-outputs.outputs.batch_job_role_arn }}
      batch_task_execution_role_arn: ${{ steps.iam-roles-outputs.outputs.batch_task_execution_role_arn }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Policy ARNs
        id: policy-arns
        run: |
          NEXTJS_ARN=$(aws cloudformation describe-stacks \
            --stack-name codec-converter-nextjs-policy-${{ needs.setup.outputs.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='NextjsPolicyArn'].OutputValue" \
            --output text || echo "")
          BATCH_ARN=$(aws cloudformation describe-stacks \
            --stack-name codec-converter-batch-policy-${{ needs.setup.outputs.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='BatchWorkerPolicyArn'].OutputValue" \
            --output text || echo "")
          echo "nextjs_policy_arn=$NEXTJS_ARN" >> $GITHUB_OUTPUT
          echo "batch_worker_policy_arn=$BATCH_ARN" >> $GITHUB_OUTPUT

      - name: Deploy Batch/Lambda Roles
        run: |
          aws cloudformation deploy \
            --template-file infra/iam/lambda-batch-roles.yaml \
            --stack-name codec-converter-iam-roles-${{ needs.setup.outputs.environment }} \
            --parameter-overrides \
              Environment=${{ needs.setup.outputs.environment }} \
              NextjsPolicyArn=${{ steps.policy-arns.outputs.nextjs_policy_arn }} \
              BatchWorkerPolicyArn=${{ steps.policy-arns.outputs.batch_worker_policy_arn }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get IAM Roles Outputs
        id: iam-roles-outputs
        run: |
          JOB_ARN=$(aws cloudformation describe-stacks \
            --stack-name codec-converter-iam-roles-${{ needs.setup.outputs.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='BatchJobRoleArn'].OutputValue" \
            --output text)
          EXEC_ARN=$(aws cloudformation describe-stacks \
            --stack-name codec-converter-iam-roles-${{ needs.setup.outputs.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='BatchTaskExecutionRoleArn'].OutputValue" \
            --output text)
          echo "batch_job_role_arn=$JOB_ARN" >> $GITHUB_OUTPUT
          echo "batch_task_execution_role_arn=$EXEC_ARN" >> $GITHUB_OUTPUT

  # Deploy CloudFormation stacks for IAM users (depends on policies and roles)
  deploy-iam-users:
    name: Deploy IAM Users
    runs-on: ubuntu-latest
    needs: [setup, deploy-iam-policies, deploy-iam-roles]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Next.js Policy ARN
        id: nextjs-policy
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name codec-converter-nextjs-policy-${{ needs.setup.outputs.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='NextjsPolicyArn'].OutputValue" \
            --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT

      - name: Get Batch Policy ARN
        id: batch-policy
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name codec-converter-batch-policy-${{ needs.setup.outputs.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='BatchWorkerPolicyArn'].OutputValue" \
            --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT

      - name: Deploy Dev Next.js User
        run: |
          aws cloudformation deploy \
            --template-file infra/iam/dev-nextjs-user.yaml \
            --stack-name codec-converter-local-nextjs-user-${{ needs.setup.outputs.environment }} \
            --parameter-overrides \
              Environment=${{ needs.setup.outputs.environment }} \
              NextjsPolicyArn=${{ steps.nextjs-policy.outputs.arn }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy Dev Batch User
        run: |
          aws cloudformation deploy \
            --template-file infra/iam/dev-batch-user.yaml \
            --stack-name codec-converter-local-batch-user-${{ needs.setup.outputs.environment }} \
            --parameter-overrides \
              Environment=${{ needs.setup.outputs.environment }} \
              BatchPolicyArn=${{ steps.batch-policy.outputs.arn }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # Deploy S3 buckets (infra/s3/buckets.yaml)
  deploy-s3-buckets:
    name: Deploy S3 Buckets
    runs-on: ubuntu-latest
    needs: [setup, deploy-iam-policies]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy S3 Buckets
        run: |
          aws cloudformation deploy \
            --template-file infra/s3/buckets.yaml \
            --stack-name codec-converter-s3-buckets-${{ needs.setup.outputs.environment }} \
            --parameter-overrides Environment=${{ needs.setup.outputs.environment }} \
            --no-fail-on-empty-changeset

  # Deploy DynamoDB Entities Table (infra/dynamodb/entities-table.yaml)
  deploy-dynamodb-entities:
    name: Deploy DynamoDB Entities Table
    runs-on: ubuntu-latest
    needs: [setup, deploy-iam-policies]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy DynamoDB Entities Table
        run: |
          aws cloudformation deploy \
            --template-file infra/dynamodb/entities-table.yaml \
            --stack-name codec-converter-dynamodb-entities-${{ needs.setup.outputs.environment }} \
            --parameter-overrides Environment=${{ needs.setup.outputs.environment }} \
            --no-fail-on-empty-changeset

  # Deploy Batch CloudFormation stack
  deploy-batch-stack:
    name: Deploy Batch Stack
    runs-on: ubuntu-latest
    needs: [setup, deploy-ecr, deploy-iam-roles]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve ECR URI (direct)
        id: resolve-ecr-uri
        run: |
          STACK=codec-converter-ecr-${{ needs.setup.outputs.environment }}
          BATCH_URI=$(aws cloudformation describe-stacks \
            --stack-name $STACK \
            --query "Stacks[0].Outputs[?OutputKey=='BatchWorkerRepositoryUri'].OutputValue" \
            --output text || echo "")
          if [ -z "$BATCH_URI" ] || [ "$BATCH_URI" = "None" ]; then
            echo "ERROR: resolved Batch ECR URI is empty. Aborting." >&2
            exit 1
          fi
          echo "Resolved Batch ECR URI: $BATCH_URI"
          echo "batch_repo_uri=$BATCH_URI" >> $GITHUB_OUTPUT
          echo "EcrRepositoryUri=$BATCH_URI" >> $GITHUB_OUTPUT

      - name: Deploy Batch CFN
        run: |
          aws cloudformation deploy \
            --template-file infra/batch/batch.yaml \
            --stack-name codec-converter-batch-${{ needs.setup.outputs.environment }} \
            --parameter-overrides \
              Environment=${{ needs.setup.outputs.environment }} \
              BatchJobRoleArn=${{ needs.deploy-iam-roles.outputs.batch_job_role_arn }} \
              BatchTaskExecutionRoleArn=${{ needs.deploy-iam-roles.outputs.batch_task_execution_role_arn }} \
              EcrRepositoryUri=${{ needs.deploy-ecr.outputs.batch_repo_uri }} \
              VpcId=${{ secrets.VPC_ID }} \
              SubnetIds=${{ secrets.SUBNET_IDS }} \
              ImageTag=${{ github.sha }} \
            --no-fail-on-empty-changeset

  # Docker build and push for Next.js
  deploy-nextjs:
    needs: [setup, deploy-ecr, deploy-iam-users, deploy-batch-stack]
    name: Deploy Next.js
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for Dockerfile
        id: check-dockerfile
        run: |
          if [ -f "./web/nextjs/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: Dockerfile not found at ./web/nextjs/Dockerfile - skipping deployment"
          fi

      - name: Configure AWS credentials
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-dockerfile.outputs.exists == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          docker build -t codec-converter-web:${{ github.sha }} ./web/nextjs
          docker tag codec-converter-web:${{ github.sha }} codec-converter-web:latest
          echo "Docker image built successfully"

      - name: Push to ECR
        if: steps.check-dockerfile.outputs.exists == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.setup.outputs.environment == 'prod' && 'codec-converter-web-prd' || 'codec-converter-web-dev' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag codec-converter-web:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag codec-converter-web:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Set IMAGE_URI output
        id: set-image-uri
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=${{ needs.setup.outputs.environment == 'prod' && 'codec-converter-web-prd' || 'codec-converter-web-dev' }}
          IMAGE_TAG=${{ github.sha }}
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Get Batch CloudFormation Outputs
        id: batch-outputs
        run: |
          STACK=codec-converter-batch-${{ needs.setup.outputs.environment }}
          JOB_QUEUE=$(aws cloudformation describe-stacks --stack-name $STACK --query "Stacks[0].Outputs[?OutputKey=='JobQueueName'].OutputValue" --output text || echo "")
          JOB_DEF=$(aws cloudformation describe-stacks --stack-name $STACK --query "Stacks[0].Outputs[?OutputKey=='JobDefinitionName'].OutputValue" --output text || echo "")
          echo "batch_job_queue=$JOB_QUEUE" >> $GITHUB_OUTPUT
          echo "batch_job_definition=$JOB_DEF" >> $GITHUB_OUTPUT

      - name: Deploy Next.js CloudFormation
        run: |
          NEXTJS_POLICY_ARN=$(aws cloudformation describe-stacks --stack-name codec-converter-nextjs-policy-${{ needs.setup.outputs.environment }} --query "Stacks[0].Outputs[?OutputKey=='NextjsPolicyArn'].OutputValue" --output text || echo "")
          IMAGE_URI=${{ steps.set-image-uri.outputs.IMAGE_URI }}
          aws cloudformation deploy \
            --template-file infra/nextjs/nextjs.yaml \
            --stack-name codec-converter-nextjs-${{ needs.setup.outputs.environment }} \
            --parameter-overrides \
              Environment=${{ needs.setup.outputs.environment }} \
              ImageUri=$IMAGE_URI \
              NextjsPolicyArn=$NEXTJS_POLICY_ARN \
              AWS_BATCH_JOB_QUEUE=${{ steps.batch-outputs.outputs.batch_job_queue }} \
              AWS_BATCH_JOB_DEFINITION=${{ steps.batch-outputs.outputs.batch_job_definition }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # Docker build and push for batch worker
  deploy-batch:
    name: Deploy Batch Worker
    runs-on: ubuntu-latest
    needs: [setup, deploy-ecr, deploy-iam-users]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for batch Dockerfile
        id: check-dockerfile
        run: |
          if [ -f "./batch/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Info: batch/Dockerfile not found - skipping deployment"
          fi

      - name: Configure AWS credentials
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-dockerfile.outputs.exists == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          docker build -t codec-converter-batch:${{ github.sha }} ./batch
          docker tag codec-converter-batch:${{ github.sha }} codec-converter-batch:latest
          echo "Docker image built successfully"

      - name: Push to ECR
        if: steps.check-dockerfile.outputs.exists == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.setup.outputs.environment == 'prod' && 'codec-converter-batch-prd' || 'codec-converter-batch-dev' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag codec-converter-batch:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag codec-converter-batch:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # Summary job to check overall status
  deploy-summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    needs: [setup, deploy-iam-policies, deploy-iam-roles, deploy-iam-users, deploy-s3-buckets, deploy-dynamodb-entities, deploy-nextjs, deploy-batch, deploy-batch-stack]
    if: always()

    steps:
      - name: Check deploy status
        run: |
          echo "Deploy Pipeline Summary:"
          echo "========================"
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Deploy IAM Policies: ${{ needs.deploy-iam-policies.result }}"
          echo "Deploy IAM Users: ${{ needs.deploy-iam-users.result }}"
          echo "Deploy S3 Buckets: ${{ needs.deploy-s3-buckets.result }}"
          echo "Deploy DynamoDB Entities: ${{ needs.deploy-dynamodb-entities.result }}"
          echo "Deploy Next.js: ${{ needs.deploy-nextjs.result }}"
          echo "Deploy Batch: ${{ needs.deploy-batch.result }}"

          # Fail the job if any deployment job failed
          if [[ "${{ needs.deploy-iam-policies.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-iam-users.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-s3-buckets.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-dynamodb-entities.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-nextjs.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-batch.result }}" == "failure" ]]; then
            echo "Deploy Pipeline failed!"
            exit 1
          fi

          echo "Deploy Pipeline passed!"
