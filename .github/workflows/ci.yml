name: CI Pipeline

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

env:
  NODE_VERSION: '18.x'
  AWS_REGION: 'ap-northeast-1'  # Tokyo region, adjust as needed

jobs:
  # Lint job for Next.js application
  lint-nextjs:
    name: Lint Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/nextjs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/nextjs/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint

  # Test job for Next.js application
  test-nextjs:
    name: Test Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/nextjs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/nextjs/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: |
          if grep -q '"test"' package.json; then
            npm test
          else
            echo "No test script found in package.json - skipping tests"
            echo "Note: Add test script to package.json when tests are implemented"
          fi

  # Build job for Next.js application
  build-nextjs:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: [lint-nextjs, test-nextjs]
    permissions:
      contents: read
      actions: write  # For uploading artifacts
    defaults:
      run:
        working-directory: ./web/nextjs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/nextjs/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js application
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: ./web/nextjs/.next
          retention-days: 7

  # Docker build and push for Next.js (skeleton)
  docker-nextjs:
    name: Docker Build & Push - Next.js
    runs-on: ubuntu-latest
    needs: [build-nextjs]
    permissions:
      contents: read
      # When ECR push is enabled, add: id-token: write (for OIDC)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Check for Dockerfile
        id: check-dockerfile
        run: |
          if [ -f "./web/nextjs/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: Dockerfile not found at ./web/nextjs/Dockerfile - skipping Docker build"
          fi
      
      # Placeholder for AWS ECR login
      # - name: Configure AWS credentials
      #   if: steps.check-dockerfile.outputs.exists == 'true'
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ env.AWS_REGION }}
      
      # - name: Login to Amazon ECR
      #   if: steps.check-dockerfile.outputs.exists == 'true'
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build Docker image (local only)
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          docker build -t codec-converter-web:latest ./web/nextjs
          echo "Docker image built successfully"
      
      # Placeholder for ECR push
      # - name: Tag and push to ECR
      #   if: steps.check-dockerfile.outputs.exists == 'true'
      #   env:
      #     ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      #     ECR_REPOSITORY: codec-converter-web
      #     IMAGE_TAG: ${{ github.sha }}
      #   run: |
      #     docker tag codec-converter-web:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      #     docker tag codec-converter-web:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
      #     docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      #     docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # Lint and test for batch worker (skeleton - to be implemented when batch/ exists)
  lint-batch:
    name: Lint Batch Worker
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if batch directory exists
        id: check-batch
        run: |
          if [ -d "./batch" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Info: batch/ directory not found - skipping batch linting"
          fi
      
      # Placeholder for batch worker linting
      # Add appropriate steps when batch worker is implemented

  # Docker build and push for batch worker (skeleton)
  docker-batch:
    name: Docker Build & Push - Batch Worker
    runs-on: ubuntu-latest
    needs: [lint-batch]
    permissions:
      contents: read
      # When ECR push is enabled, add: id-token: write (for OIDC)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Check for batch Dockerfile
        id: check-dockerfile
        run: |
          if [ -f "./batch/Dockerfile" ]; then
