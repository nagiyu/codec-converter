      #     aws-region: ${{ env.AWS_REGION }}
      
      # - name: Login to Amazon ECR
      #   if: steps.check-dockerfile.outputs.exists == 'true'
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build Docker image (local only)
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
