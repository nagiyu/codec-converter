      #   run: |
      #     docker tag codec-converter-batch:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      #     docker tag codec-converter-batch:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
      #     docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      #     docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # Summary job to check overall status
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-nextjs, test-nextjs, build-nextjs, lint-batch]
    if: always()
    
    steps:
      - name: Check CI status
        run: |
          echo "CI Pipeline Summary:"
          echo "==================="
          echo "Lint Next.js: ${{ needs.lint-nextjs.result }}"
          echo "Test Next.js: ${{ needs.test-nextjs.result }}"
          echo "Build Next.js: ${{ needs.build-nextjs.result }}"
          echo "Lint Batch: ${{ needs.lint-batch.result }}"
          
          # Fail the job if any required job failed
          if [[ "${{ needs.lint-nextjs.result }}" == "failure" ]] || \
             [[ "${{ needs.test-nextjs.result }}" == "failure" ]] || \
             [[ "${{ needs.build-nextjs.result }}" == "failure" ]]; then
            echo "CI Pipeline failed!"
            exit 1
          fi
          
          echo "CI Pipeline passed!"
