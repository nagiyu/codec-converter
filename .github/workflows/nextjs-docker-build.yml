name: Next.js Docker Build Validation

on:
  pull_request:
    paths:
      - 'web/nextjs/**'
      - '.github/workflows/nextjs-docker-build.yml'

jobs:
  validate-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Next.js Docker image
      run: |
        cd web/nextjs
        docker build -t codec-converter-web:test .
    
    - name: Verify build output
      run: |
        echo "✅ Next.js Docker image built successfully"
        docker images codec-converter-web:test
